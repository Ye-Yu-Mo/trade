name: Bug report
description: 报告可复现的问题
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: 发生了什么
      description: 实际行为与预期行为
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      description: 命令、参数、使用的策略与环境
      placeholder: |
        cargo run --release -- backtest --symbol BTCUSDT --interval 1h --start 2025-01-01 --end 2025-03-01
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志 / 报错
      description: 请脱敏，删除 API key、账户信息
      render: text

  - type: input
    id: version
    attributes:
      label: 版本 / commit
      description: 例如 v0.2.0 或 commit hash
